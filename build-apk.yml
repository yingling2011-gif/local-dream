name: .github/workflows/build-apk.yml

# 在 GitHub 的 x86_64 runner 上编译 Local Dream（含 spill-fill 修复），产出可直接安装的 APK。
#
# 用法：Actions -> Build Local Dream APK -> Run workflow
# 单文件版 + fork 专用：补丁已内嵌，直接编你 fork 的当前分支，仓库里只需要放这一条 workflow
# 无需单独 checkout 上游，也不依赖 upstream_ref
#   qairt_url   : QAIRT/QNN SDK 2.50.0.260828 的直链（多个包用英文逗号分隔），必须能在 CI 里直接下载
#   qairt_auth  : 可选，下载 SDK 用的 Authorization 头，例如 "Bearer ghp_xxx"
#   upstream_ref: 上游 commit（默认固定为本补丁对应的版本，勿随意改动）
#   build_apk   : 关掉可以只编原生库（调试用）
#
# 说明：Qualcomm 的 SDK 需要登录才能下载，无法由本工作流代下；
#       请把它放到“有直链”的地方（自己的私有仓库 Release asset / 对象存储 / 自己的服务器）。

on:
  workflow_dispatch:
    inputs:
      qairt_url:
        description: 'QAIRT SDK 2.50.0.260828 直链（多个 zip 用英文逗号分隔）'
        required: true
        type: string
      qairt_auth:
        description: '(可选) 下载 SDK 的 Authorization 头，如 Bearer ghp_xxx'
        required: false
        type: string
      build_apk:
        description: '是否继续打包 APK（关掉则只编原生库）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # CMakePresets.json 的 environment 段写死了 ANDROID_NDK_ROOT=/data/android-ndk-r28，
      # 所以这里也必须把 NDK 放到 /data/android-ndk-r28，不要去改工程文件。
      NDK_DIR: /data/android-ndk-r28
      NDK_ZIP_URL: https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
    steps:
      - name: 1. 取回本仓库 + 全部子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 2. 应用 spill-fill 修复补丁（补丁以 base64 内嵌在本文件里）
        run: |
          set -euo pipefail
          base64 -d > /tmp/fix.patch <<'LOCAL_DREAM_PATCH_B64'
