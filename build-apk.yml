      - name: 3. 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 4. 安装 Rust + android target（tokenizers-cpp 需要 cargo）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 5. 安装 Android SDK 平台 / 构建工具
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          SDKMANAGER="${SDKMANAGER:-$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager}"
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # compileSdk = 37：API 37 只有 android-37.x 这种带小版本号的包，先都装上
          "$SDKMANAGER" --channel=3 "platform-tools" "build-tools;37.0.0" \
            "platforms;android-37.0" "platforms;android-37.1" "platforms;android-36" || true
          echo "--- 已安装的 platforms ---"
          ls -1 "$ANDROID_SDK_ROOT/platforms" || true
          echo "--- 已安装的 build-tools ---"
          ls -1 "$ANDROID_SDK_ROOT/build-tools" || true

      - name: 6. 安装 NDK r28 到 /data/android-ndk-r28
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o /tmp/ndk.zip "$NDK_ZIP_URL"
          sudo mkdir -p /data
          sudo unzip -q /tmp/ndk.zip -d /data
          SRC_DIR="$(find /data -maxdepth 1 -type d -name 'android-ndk-*' ! -name 'android-ndk-r28' | head -1)"
          echo "NDK 解包目录：$SRC_DIR"
          sudo mv "$SRC_DIR" "$NDK_DIR"
          du -sh "$NDK_DIR"
          ls "$NDK_DIR/build/cmake/android.toolchain.cmake"

      - name: 7. 下载并解包 QAIRT/QNN SDK
        env:
          QAIRT_URLS: ${{ inputs.qairt_url }}
          QAIRT_AUTH: ${{ inputs.qairt_auth }}
        run: |
          set -euo pipefail
          rm -rf /tmp/qairt && mkdir -p /tmp/qairt/dl /tmp/qairt/unpack && cd /tmp/qairt
          # 支持英文逗号或换行分隔的多个直链；也支持带签名的 URL
          printf '%s' "$QAIRT_URLS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > urls.txt
          echo "待下载包数：$(wc -l < urls.txt)"
          i=0
          while read -r u; do
            i=$((i+1))
            seg="${u%%\?*}"
            name="$(basename "$seg")"
            case "$name" in
              *.zip|*.ZIP|*.tar.gz|*.tgz|*.z0[0-9]) ;;
              *) name="part$i.zip" ;;
            esac
            echo "--- 下载 [$i] $u  -> dl/$name"
            if [ -n "${QAIRT_AUTH:-}" ]; then
              curl -fL --retry 3 --retry-delay 5 -H "Authorization: $QAIRT_AUTH" -o "dl/$name" "$u"
            else
              curl -fL --retry 3 --retry-delay 5 -o "dl/$name" "$u"
            fi
          done < urls.txt
          ls -lh dl

          # 普通 zip 直接解；用 `zip -s` 分卷时只解最后一个 .zip（unzip 会自动找同目录的 .z01/.z02）
          for z in dl/*.zip dl/*.ZIP; do
            [ -e "$z" ] || continue
            echo "--- 解包 $z"
            unzip -q -o "$z" -d unpack
          done
          for t in dl/*.tar.gz dl/*.tgz; do
            [ -e "$t" ] || continue
            echo "--- 解包 $t"
            tar -xzf "$t" -C unpack
          done

          # 自动定位 SDK 根目录（含 include/QNN/QnnInterface.h 的那一层）
          HDR="$(find /tmp/qairt/unpack -path '*/include/QNN/QnnInterface.h' | head -1)"
          if [ -z "$HDR" ]; then
            echo "::error::在下载的包里找不到 include/QNN/QnnInterface.h —— 你给的直链可能只是运行库，缺 SDK 头文件包。"
            find /tmp/qairt/unpack -maxdepth 3 -type d | head -40
            exit 1
          fi
          ROOT="$(cd "$(dirname "$HDR")/../.." && pwd)"
          echo "QNN_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "SDK 根目录：$ROOT"
          ls "$ROOT"

          # 编译还必须要 SDK 自带的 SampleApp 源码和许可证文件（CMakeLists 会拷贝它们）
          for p in examples/QNN/SampleApp/SampleApp/src/QnnSampleApp.cpp \
                   examples/QNN/SampleApp/SampleApp/src/Utils/IOTensor.cpp \
                   LICENSE.pdf NOTICE.txt QNN_NOTICE.txt; do
            if [ ! -e "$ROOT/$p" ]; then
              echo "::error::SDK 缺少 $p —— 请下载完整的 QAIRT SDK（含 examples 与 notice 文件），而不是仅运行库。"
              exit 1
            fi
          done

          # 运行库 / Hexagon skel 也必须在：CMake 会按 68/69/73/75/79/81 逐架构拷贝，缺一个配置阶段就失败
          MISS=0
          for p in lib/aarch64-android/libQnnHtp.so lib/aarch64-android/libQnnSystem.so; do
            [ -e "$ROOT/$p" ] || { echo "::error::SDK 缺少 $p"; MISS=1; }
          done
          for a in 68 69 73 75 79 81; do
            for p in "lib/aarch64-android/libQnnHtpV${a}Stub.so" \
                     "lib/hexagon-v${a}/unsigned/libQnnHtpV${a}.so" \
                     "lib/hexagon-v${a}/unsigned/libQnnHtpV${a}Skel.so"; do
              [ -e "$ROOT/$p" ] || { echo "::error::SDK 缺少 $p"; MISS=1; }
            done
          done
          if [ "$MISS" -ne 0 ]; then
            echo "::error::SDK 不完整（缺运行库或 Hexagon skel），请下载完整 QAIRT SDK 后重试。"
            exit 1
          fi
          df -h / /tmp | sed -n '1,4p'
          echo "SDK 内容检查通过。"

      - name: 8. 编译原生库（QNN + MNN + tokenizers，20~40 分钟）
        working-directory: app/src/main/cpp
        run: |
          set -euo pipefail
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT"
          nproc
          df -h / | tail -1
          ./build.sh
          echo "--- 产物 ---"
          ls -lh ../jniLibs/arm64-v8a/
          ls -1 ../assets/qnnlibs/ | head

      - name: 9. 打包 APK（release、自动生成签名）
        if: ${{ inputs.build_apk }}
        run: |
          set -uo pipefail
          chmod +x gradlew

          KS="$PWD/ci.jks"   # 必须是绝对路径：app/build.gradle.kts 里的 file() 相对 app 模块解析
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
            -alias cikey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LocalDream CI,O=CI,C=CN" >/dev/null 2>&1

          SIG=(-PRELEASE_STORE_FILE="$KS" -PRELEASE_STORE_PASSWORD=android -PRELEASE_KEY_ALIAS=cikey -PRELEASE_KEY_PASSWORD=android)

          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease "${SIG[@]}" 2>&1 | tee /tmp/gradle1.log
          status=${PIPESTATUS[0]}

          # 兼容处理：如果只是找不到 android-37 平台，就用已装好的 android-37.x 做软链再试一次
          if [ "$status" -ne 0 ] && grep -Eq "android-37|Failed to find target|platforms;android-37" /tmp/gradle1.log; then
            echo "::warning::首次构建因 android-37 平台失败，尝试软链后重试"
            for c in android-37.0 android-37.1 android-37.2; do
              if [ -d "$ANDROID_SDK_ROOT/platforms/$c" ]; then
                ln -sfn "$c" "$ANDROID_SDK_ROOT/platforms/android-37"
                break
              fi
            done
            ls -l "$ANDROID_SDK_ROOT/platforms"
            ./gradlew --no-daemon --stacktrace assembleRelease "${SIG[@]}" 2>&1 | tee /tmp/gradle2.log
            status=${PIPESTATUS[0]}
          fi
          exit "$status"

      - name: 10. 收集 APK
        if: ${{ inputs.build_apk }}
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} out/ \;
          ls -lh out
          for ap in out/*.apk; do
            echo "== $ap"; unzip -l "$ap" | grep -E "libstable_diffusion_core|assets/qnnlibs" | head -5 || true
          done

      - name: 11. 上传 APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: LocalDream-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 12. 失败时把日志一并上传
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            /tmp/gradle1.log
            /tmp/gradle2.log
          if-no-files-found: ignore
          retention-days: 7
